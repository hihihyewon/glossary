<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="AI·인프라·거버넌스 404개 용어를 영문 표기, 한글 발음, 한 줄 정의, 사용 빈도로 정리한 사전.">
<title>클러쉬 AI 용어 사전</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,400..800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* 레이아웃: 사전형 2단 — 왼쪽 표제어+발음, 오른쪽 정의. 상단 고정 검색바 + 분야 칩 */
:root{
  --paper:#E6E9F1; --card:#F7F8FC; --ink:#0D1730; --ink-mid:#5A6480;
  --rule:#C7CEDF; --accent:#2A34D4; --mark:#FFD1E3; --mark-fg:#0D1730;
  --chip-bg:#DDE3FA; --chip-fg:#2A34D4; --shadow:rgba(13,23,48,.08);
  --sans:'IBM Plex Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --grotesk:'Archivo','IBM Plex Sans KR',Helvetica,Arial,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --gut:clamp(16px,4vw,56px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0B1020; --card:#141B30; --ink:#E7EBF5; --ink-mid:#9AA4C0;
  --rule:#2A3350; --accent:#8E97FF; --mark:#5A2D47; --mark-fg:#FFE3EF;
  --chip-bg:#1E2748; --chip-fg:#A8B0FF; --shadow:rgba(0,0,0,.4);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0B1020; --card:#141B30; --ink:#E7EBF5; --ink-mid:#9AA4C0;
  --rule:#2A3350; --accent:#8E97FF; --mark:#5A2D47; --mark-fg:#FFE3EF;
  --chip-bg:#1E2748; --chip-fg:#A8B0FF; --shadow:rgba(0,0,0,.4);
  color-scheme:dark;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:3px;border-radius:3px}
mark{background:var(--mark);color:var(--mark-fg);padding:0 .1em;border-radius:2px}
.wrap{max-width:1380px;margin:0 auto;padding-inline:var(--gut)}

/* masthead */
.masthead{padding-block:clamp(26px,5vw,56px) clamp(16px,2.5vw,28px)}
.eyebrow{font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.18em;
  text-transform:uppercase;color:var(--accent)}
h1{font-weight:700;font-size:clamp(1.45rem,3.2vw,2rem);letter-spacing:-.03em;
  line-height:1.25;margin-top:10px;text-wrap:balance}
.sub{color:var(--ink-mid);margin-top:10px;max-width:60ch;font-size:.93rem}

/* specimen */
.spec{border-top:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);
  padding-block:clamp(18px,3vw,34px);display:flex;flex-wrap:wrap;
  align-items:flex-end;gap:clamp(12px,2.5vw,36px)}
.spec__label{font-family:var(--mono);font-size:.66rem;font-weight:600;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink-mid);width:100%}
.spec__term{font-family:var(--grotesk);font-weight:700;font-stretch:118%;
  font-size:clamp(1.8rem,6.5vw,4rem);line-height:.98;letter-spacing:-.035em;
  flex:1 1 auto;min-width:0;overflow-wrap:break-word}
.spec__side{display:flex;align-items:center;gap:10px;padding-bottom:.35em}
.spec__pron{font-family:var(--mono);font-size:clamp(.95rem,2.2vw,1.35rem);
  color:var(--accent);white-space:nowrap}
.spec__def{flex:0 1 38ch;min-width:0;color:var(--ink-mid);font-size:.88rem;
  line-height:1.55;padding-bottom:.4em}
.shuffle{background:none;border:1.5px solid var(--rule);border-radius:100px;
  padding:7px 14px;font-family:var(--mono);font-size:.68rem;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-mid);cursor:pointer;
  transition:border-color .15s,color .15s}
.shuffle:hover{border-color:var(--ink);color:var(--ink)}

/* speak */
.say{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--rule);
  background:transparent;color:var(--accent);display:grid;place-items:center;cursor:pointer;
  transition:background .15s,border-color .15s,color .15s}
.say svg{width:11px;height:11px;fill:currentColor}
.say:hover,.say.on{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.spec__side .say{width:38px;height:38px}
.spec__side .say svg{width:13px;height:13px}

/* searchbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
  background:var(--paper);border-bottom:1px solid var(--rule)}
.bar__in{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:12px}
.field{flex:1 1 240px;min-width:0;display:flex;align-items:center;gap:10px;
  border:1.5px solid var(--ink);border-radius:100px;background:var(--card);
  padding-inline:18px;height:46px;transition:box-shadow .15s}
.field:focus-within{box-shadow:0 0 0 3px var(--chip-bg)}
.field>svg{width:15px;height:15px;fill:none;stroke:var(--ink-mid);stroke-width:2;flex:none}
#q{flex:1;min-width:0;border:none;background:none;font-family:var(--sans);
  font-size:1rem;color:var(--ink)}
#q:focus{outline:none}
.kbd{font-family:var(--mono);font-size:.66rem;color:var(--ink-mid);
  border:1px solid var(--rule);border-radius:5px;padding:2px 6px;flex:none}
.clear{border:none;background:none;color:var(--ink-mid);cursor:pointer;
  font-size:1.05rem;line-height:1;padding:4px}
.count{font-family:var(--mono);font-size:.74rem;color:var(--ink-mid);white-space:nowrap;
  font-variant-numeric:tabular-nums}
.count b{color:var(--accent);font-weight:600}

/* chips */
.rail{display:flex;gap:8px;overflow-x:auto;padding-block:16px 8px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{white-space:nowrap;border:1.5px solid var(--rule);background:transparent;
  border-radius:100px;padding:7px 15px;cursor:pointer;color:var(--ink-mid);
  font-family:var(--sans);font-size:.85rem;font-weight:500;
  transition:border-color .15s,color .15s,background .15s}
.rail button:hover{border-color:var(--ink);color:var(--ink)}
.rail button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.rail .n{font-family:var(--mono);font-size:.7rem;opacity:.65;margin-left:7px}
.rail .doc[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

/* results */
main{padding-bottom:72px}
.sec{margin-top:clamp(26px,3.5vw,46px)}
.sec__head{display:flex;align-items:baseline;gap:12px;padding-bottom:9px;
  border-bottom:1.5px solid var(--ink)}
.sec__head h2{font-size:.98rem;font-weight:700;letter-spacing:-.01em}
.sec__head .n{font-family:var(--mono);font-size:.7rem;color:var(--ink-mid)}
.entry{display:grid;grid-template-columns:1fr;gap:5px;padding-block:16px;
  border-bottom:1px solid var(--rule)}
.key{display:flex;flex-wrap:wrap;align-items:center;gap:7px 11px}
.term{font-family:var(--grotesk);font-weight:700;font-stretch:112%;
  font-size:1.05rem;letter-spacing:-.02em;line-height:1.3;min-width:0;overflow-wrap:break-word}
.pron{font-family:var(--mono);font-size:.82rem;color:var(--accent)}
.def{color:var(--ink-mid);font-size:.93rem;max-width:72ch;min-width:0}
.freq{display:inline-flex;gap:3px;align-items:center;flex:none}
.freq i{width:7px;height:7px;border:1.5px solid var(--rule);border-radius:2px;display:block}
.freq i.on{background:var(--accent);border-color:var(--accent)}
.legend{display:flex;align-items:center;gap:8px;flex-wrap:wrap;color:var(--ink-mid);font-size:.78rem;padding-block:10px 0}
.legend .freq i{width:6px;height:6px}
@media (min-width:880px){
  .entry{grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:0 40px;align-items:start}
  .key{flex-direction:column;align-items:flex-start;gap:5px}
  .key .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;min-width:0}
  .def{padding-top:2px}
}
.empty{padding-block:60px;max-width:48ch}
.empty h3{font-size:1.1rem;letter-spacing:-.02em}
.empty p{color:var(--ink-mid);margin-top:8px;font-size:.92rem}
.empty button{margin-top:18px;border:1.5px solid var(--ink);background:var(--ink);
  color:var(--paper);border-radius:100px;padding:10px 20px;font-family:var(--sans);
  font-size:.9rem;cursor:pointer}
footer{border-top:1px solid var(--rule);padding-block:24px 56px;
  font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;
  color:var(--ink-mid);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}
</style>
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>


<header class="wrap masthead">
  <div class="eyebrow">Clush · AI Lexicon</div>
  <h1>회의에서 바로 쓰는 AI 용어 사전</h1>
  <p class="sub">영문 표기, 한글 발음, 한 줄 정의. 영어·한글·설명 어느 쪽으로 검색해도 찾을 수 있습니다. 각 용어 옆 세 칸은 사용 빈도입니다. 사내 문서에서 실제로 쓰인 횟수(60%)와 업계 전반의 사용 빈도(40%)를 합산했습니다.</p>
</header>

<section class="wrap" aria-label="오늘의 용어">
  <div class="spec">
    <div class="spec__label">오늘의 용어</div>
    <div class="spec__term" id="specTerm">&nbsp;</div>
    <div class="spec__side">
      <div class="spec__pron" id="specPron"></div>
      <button class="say" id="specSay" aria-label="발음 듣기">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1.2 10.4 6 2 10.8z"/></svg>
      </button>
    </div>
    <p class="spec__def" id="specDef"></p>
    <button class="shuffle" id="shuffle" type="button">다른 용어</button>
  </div>
</section>

<div class="bar">
  <div class="wrap bar__in">
    <label class="field" for="q">
      <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M12.8 12.8 17 17"/></svg>
      <input id="q" type="search" autocomplete="off" placeholder="RAG, 추론, 거버넌스, 할루시네이션…">
      <button class="clear" id="clear" type="button" aria-label="검색어 지우기" hidden>✕</button>
      <span class="kbd">/</span>
    </label>
    <p class="count" id="count" role="status"></p>
  </div>
</div>

<main class="wrap">
  <nav class="rail" id="rail" aria-label="분야 필터"></nav>
  <p class="legend" id="legend"></p>
  <div id="results"></div>
</main>

<footer class="wrap" id="foot"></footer>

번 갱신하는 단위", "c": "학습 & 최적화", "f": 1, "s": 20}, {"n": "Convergence", "p": "컨버전스", "d": "수렴. 학습이 진행되며 손실이 더 이상 줄지 않고 안정 상태에 도달하는 것", "c": "학습 & 최적화", "f": 2, "s": 35}, {"n": "Overfitting", "p": "오버피팅", "d": "과적합. 학습 데이터에만 과하게 맞춰져 새로운 데이터에서 성능이 떨어지는 현상", "c": "학습 & 최적화", "f": 2, "s": 32}, {"n": "Underfitting", "p": "언더피팅", "d": "과소적합. 모델이 너무 단순해 학습 데이터의 패턴조차 제대로 못 잡는 상태", "c": "학습 & 최적화", "f": 1, "s": 20}, {"n": "Regularization", "p": "레귤러라이제이션", "d": "정규화. 과적합을 막기 위해 손실 함수에 제약을 더하는 기법", "c": "학습 & 최적화", "f": 1, "s": 26}, {"n": "Dropout", "p": "드롭아웃", "d": "학습 중 일부 뉴런을 무작위로 비활성화해 과적합을 억제하는 정규화 기법", "c": "학습 & 최적화", "f": 1, "s": 26}, {"n": "Batch Normalization", "p": "배치 노멀라이제이션", "d": "배치 정규화. 각 층의 입력 분포를 정규화해 학습을 안정화하고 가속", "c": "학습 & 최적화", "f": 1, "s": 26}, {"n": "Early Stopping", "p": "얼리 스토핑", "d": "조기 중단. 검증 성능이 더 이상 개선되지 않으면 학습을 멈춰 과적합과 낭비를 줄임", "c": "학습 & 최적화", "f": 2, "s": 41}, {"n": "Augmentation", "p": "어그멘테이션", "d": "데이터 증강. 기존 데이터를 변형해 학습 데이터를 늘리는 기법", "c": "학습 & 최적화", "f": 1, "s": 20}, {"n": "Fine-tuning", "p": "파인튜닝", "d": "미세조정. 사전학습된 모델을 특정 작업·도메인 데이터로 추가 학습", "c": "학습 & 최적화", "f": 2, "s": 56}, {"n": "LoRA (Low-Rank Adaptation)", "p": "로라", "d": "저랭크 적응. 원본 가중치는 두고 작은 보조 행렬만 학습해 비용을 크게 줄이는 미세조정 기법", "c": "학습 & 최적화", "f": 1, "s": 26}, {"n": "PEFT", "p": "피이에프티", "d": "Parameter-Efficient Fine-Tuning. 전체 파라미터 대신 일부만 학습하는 효율적 미세조정 기법군", "c": "학습 & 최적화", "f": 1, "s": 20}, {"n": "RLHF", "p": "알엘에이치에프", "d": "Reinforcement Learning from Human Feedback. 사람의 선호 평가를 보상 신호로 삼아 모델을 정렬하는 학습", "c": "학습 & 최적화", "f": 1, "s": 26}, {"n": "DPO (Direct Preference Optimization)", "p": "디피오", "d": "직접 선호 최적화. 별도 보상 모델 없이 선호 데이터로 바로 정렬하는 RLHF 대안", "c": "학습 & 최적화", "f": 1, "s": 20}, {"n": "Instruction Tuning", "p": "인스트럭션 튜닝", "d": "명령어 튜닝. 지시문-응답 쌍으로 학습시켜 사용자의 명령을 잘 따르게 만드는 과정", "c": "학습 & 최적화", "f": 1, "s": 26}, {"n": "Distillation", "p": "디스틸레이션", "d": "지식 증류. 큰 교사 모델의 출력을 작은 학생 모델이 모방하도록 학습시켜 경량화", "c": "학습 & 최적화", "f": 1, "s": 26}, {"n": "Quantization", "p": "퀀타이제이션", "d  "Keyword Search (BM25)", "p": "키워드 서치", "d": "단어 일치 기반 전통적 검색. 고유명사·코드·품번에 강함", "c": "RAG & 검색", "f": 1, "s": 20}, {"n": "Hybrid Search", "p": "하이브리드 서치", "d": "벡터 검색과 키워드 검색을 결합해 양쪽의 약점을 보완하는 검색 전략", "c": "RAG & 검색", "f": 2, "s": 50}, {"n": "ReRanking", "p": "리랭킹", "d": "재순위화. 1차 검색 결과를 더 정밀한 모델로 다시 정렬해 상위 정확도를 높이는 단계", "c": "RAG & 검색", "f": 2, "s": 50}, {"n": "HyDE", "p": "하이디이", "d": "Hypothetical Document Embeddings. 가상의 답변을 먼저 생성해 그 임베딩으로 검색 품질을 높이는 기법", "c": "RAG & 검색", "f": 2, "s": 36}, {"n": "Query Expansion", "p": "쿼리 익스팬션", "d": "질의 확장. 원 질문을 여러 변형으로 늘려 검색 누락을 줄이는 기법", "c": "RAG & 검색", "f": 1, "s": 20}, {"n": "Cosine Similarity", "p": "코사인 유사도", "d": "두 벡터가 이루는 각도로 유사도를 재는 척도. 벡터 검색의 기본 거리 함수", "c": "RAG & 검색", "f": 1, "s": 20}, {"n": "ANN (Approximate Nearest Neighbor)", "p": "에이엔엔", "d": "근사 최근접 이웃. 정확도를 조금 양보하고 대규모 벡터 검색을 빠르게 수행하는 알고리즘", "c": "RAG & 검색", "f": 1, "s": 12}, {"n": "HNSW", "p": "에이치엔에스더블유", "d": "계층적 그래프로 근사 최근접 이웃을 탐색하는 대표적인 벡터 인덱스 구조", "c": "RAG & 검색", "f": 1, "s": 12}, {"n": "Index", "p": "인덱스", "d": "검색을 빠르게 하기 위해 데이터를 미리 구조화해 둔 것", "c": "RAG & 검색", "f": 2, "s": 50}, {"n": "Context Stuffing", "p": "컨텍스트 스터핑", "d": "검색 결과를 프롬프트에 넣어 모델에 전달하는 것. 넣는 양과 순서가 품질을 좌우", "c": "RAG & 검색", "f": 1, "s": 12}, {"n": "Citation", "p": "사이테이션", "d": "출처 표기. 생성된 답변이 어느 문서의 어느 부분에 근거했는지 제시하는 기능", "c": "RAG & 검색", "f": 1, "s": 12}, {"n": "GraphRAG", "p": "그래프 래그", "d": "지식 그래프 구조를 활용해 개체 간 관계까지 고려하는 검색증강생성 방식", "c": "RAG & 검색", "f": 1, "s": 20}, {"n": "Ontology", "p": "온톨로지", "d": "개체와 개체 간 관계를 형식적으로 정의한 지식 체계. 도메인 용어를 기계가 해석 가능하게 만듦", "c": "RAG & 검색", "f": 3, "s": 77}, {"n": "Knowledge Graph", "p": "날리지 그래프", "d": "지식 그래프. 개체를 노드, 관계를 엣지로 표현한 그래프형 지식베이스", "c": "RAG & 검색", "f": 1, "s": 26}, {"n": "Graph DB", "p": "그래프 디비", "d": "노드와 관계를 일급 객체로 저장·질의하는 데이터베이스", "c": "RAG & 검색", "f": 2, "s": 53}, {"n": "AI OCR", "p": "에이아이 오씨아르", "d": "AI 기반 문서 인식. 스캔본·이미지·표를 구조화된 텍스트로 변환해 AI가 활용 가능한 형태로 만듦", "c": "RAG & 검색", "f": 3, "s": 68}, {"n": "Semantic Parsing", "p": const UPDATED = "2026.10.08";

const $ = s => document.querySelector(s);
const qEl = $('#q'), results = $('#results'), rail = $('#rail'),
      countEl = $('#count'), clearBtn = $('#clear');
const CATS = [...new Set(TERMS.map(t => t.c))];
let cat = 'all', docOnly = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => String(s).toLowerCase().replace(/\s+/g, '');

function hi(text, term){
  const safe = esc(text);
  if(!term) return safe;
  const re = new RegExp(term.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'gi');
  return safe.replace(re, m => '<mark>' + m + '</mark>');
}
function hit(t, term){
  if(!term) return true;
  const n = norm(term);
  return norm(t.n).includes(n) || norm(t.p).includes(n) || norm(t.d).includes(n);
}
function say(text, btn){
  if(!('speechSynthesis' in window)) return;
  const clean = text.replace(/\(.*?\)/g, ' ').replace(/[가-힣]/g, '').replace(/\s+/g, ' ').trim();
  if(!clean) return;
  const u = new SpeechSynthesisUtterance(clean);
  u.lang = 'en-US'; u.rate = .85;
  try { speechSynthesis.cancel(); } catch(e) {}
  if(btn){ btn.classList.add('on'); u.onend = u.onerror = () => btn.classList.remove('on'); }
  speechSynthesis.speak(u);
}

function freq(n){
  const cells = [1,2,3].map(i => `<i class="${i<=n?'on':''}"></i>`).join('');
  return `<span class="freq" role="img" aria-label="사용 빈도 ${n}/3" title="사용 빈도 ${n}/3">${cells}</span>`;
}

function buildRail(){
  const docN = TERMS.filter(t => t.f === 3).length;
  const chip = (label, key, n) =>
    `<button type="button" data-k="${esc(key)}" aria-pressed="${cat===key}">${esc(label)}<span class="n">${n}</span></button>`;
  rail.innerHTML =
    chip('전체', 'all', TERMS.length) +
    `<button type="button" class="doc" data-doc="1" aria-pressed="${docOnly}">자주 쓰임<span class="n">${docN}</span></button>` +
    CATS.map(c => chip(c, c, TERMS.filter(t => t.c === c).length)).join('');
}
rail.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(b.dataset.doc) docOnly = !docOnly; else cat = b.dataset.k;
  buildRail(); render();
});

function render(){
  const term = qEl.value.trim();
  clearBtn.hidden = term === '';
  let total = 0, html = '';
  for(const c of CATS){
    if(cat !== 'all' && cat !== c) continue;
    const list = TERMS.filter(t => t.c === c && (!docOnly || t.f === 3) && hit(t, term));
    if(!list.length) continue;
    total += list.length;
    html += `<section class="sec"><div class="sec__head"><h2>${esc(c)}</h2><span class="n">${list.length}</span></div>` +
      list.map(t => `<article class="entry">
        <div class="key"><div class="row">
          <h3 class="term">${hi(t.n, term)}</h3>
          <button class="say" type="button" data-say="${esc(t.n)}" aria-label="${esc(t.n)} 발음 듣기">
            <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1.2 10.4 6 2 10.8z"/></svg>
          </button>${freq(t.f)}
        </div><p class="pron">/${hi(t.p, term)}/</p></div>
        <p class="def">${hi(t.d, term)}</p></article>`).join('') + '</section>';
  }
  if(!total){
    html = `<div class="empty"><h3>조건에 맞는 용어가 없습니다</h3>
      <p>영문 표기, 한글 발음, 정의 세 곳을 모두 찾아봤습니다. 검색어를 줄이거나 분야를 전체로 바꿔 보세요.</p>
      <button type="button" id="reset">검색 조건 지우기</button></div>`;
  }
  results.innerHTML = html;
  countEl.innerHTML = (term || cat !== 'all' || docOnly)
    ? `<b>${total}</b> / ${TERMS.length}개`
    : `총 <b>${TERMS.length}</b>개 용어`;
}

results.addEventListener('click', e => {
  const s = e.target.closest('[data-say]');
  if(s){ say(s.dataset.say, s); return; }
  if(e.target.id === 'reset'){
    qEl.value = ''; cat = 'all'; docOnly = false; buildRail(); render(); qEl.focus();
  }
});
qEl.addEventListener('input', render);
clearBtn.addEventListener('click', () => { qEl.value = ''; render(); qEl.focus(); });
document.addEventListener('keydown', e => {
  if(e.key === '/' && document.activeElement !== qEl){ e.preventDefault(); qEl.focus(); }
  if(e.key === 'Escape' && document.activeElement === qEl){ qEl.value = ''; render(); }
});

let last = -1;
function specimen(){
  let i; do { i = Math.floor(Math.random() * TERMS.length); } while(TERMS.length > 1 && i === last);
  last = i; const t = TERMS[i];
  $('#specTerm').textContent = t.n.replace(/\s*\(.*?\)\s*/, '');
  $('#specPron').textContent = '/' + t.p + '/';
  $('#specDef').textContent = t.d;
  const b = $('#specSay'); b.dataset.say = t.n; b.setAttribute('aria-label', t.n + ' 발음 듣기');
}
$('#shuffle').addEventListener('click', specimen);
$('#specSay').addEventListener('click', e => say(e.currentTarget.dataset.say, e.currentTarget));
