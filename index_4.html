<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 산업 종합 용어집 - 검색가능</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #2c3e50;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .controls {
            padding: 20px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .search-icon {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #7f8c8d;
            font-size: 1.2em;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .filter-label {
            font-weight: 600;
            color: #2c3e50;
        }

        .category-filter {
            padding: 8px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9em;
            font-weight: 500;
            color: #2c3e50;
        }

        .category-filter:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }

        .category-filter.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .content {
            padding: 30px;
            max-height: calc(100vh - 300px);
            overflow-y: auto;
        }

        .section {
            margin-bottom: 30px;
            display: none;
        }

        .section.active {
            display: block;
        }

        .section-title {
            font-size: 1.8em;
            color: #667eea;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
            font-weight: 700;
        }

        .subsection {
            margin-bottom: 20px;
        }

        .subsection-title {
            font-size: 1.2em;
            color: #764ba2;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .term-item {
            padding: 12px;
            margin-bottom: 10px;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .term-item:hover {
            background: #eef2ff;
            transform: translateX(5px);
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.15);
        }

        .term-item.highlight {
            background: #fff3cd;
            border-left-color: #ffc107;
        }

        .term-header {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .term-name {
            font-weight: 700;
            color: #667eea;
            font-size: 1.05em;
        }

        .term-pronunciation {
            font-size: 0.7em;
            color: #6B8BA8;
            font-weight: 500;
            font-style: italic;
            display: inline-block;
        }

        .term-definition {
            color: #555;
            margin-top: 5px;
            font-size: 0.95em;
            line-height: 1.5;
        }

        .no-results {
            text-align: center;
            padding: 40px 20px;
            color: #7f8c8d;
            font-size: 1.1em;
        }

        .stats {
            text-align: center;
            padding: 15px;
            background: #f0f4ff;
            font-size: 0.9em;
            color: #667eea;
            font-weight: 600;
        }

        .footer {
            padding: 20px;
            text-align: center;
            background: #f8f9fa;
            color: #7f8c8d;
            font-size: 0.9em;
            border-top: 1px solid #e0e0e0;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .controls {
                flex-direction: column;
                gap: 10px;
            }

            .search-box {
                min-width: 100%;
            }

            .filter-group {
                width: 100%;
            }

            .content {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 AI 산업 종합 용어집</h1>
            <p>400개 이상의 AI 용어를 검색하세요</p>
        </div>

        <div class="controls">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" id="searchInput" placeholder="용어명이나 설명으로 검색... (예: RAG, 정규화, 규제)">
            </div>
            <div class="filter-group">
                <span class="filter-label">카테고리:</span>
                <button class="category-filter active" data-category="all">모두</button>
                <button class="category-filter" data-category="기초">기초</button>
                <button class="category-filter" data-category="생성형">생성형</button>
                <button class="category-filter" data-category="기술">기술</button>
                <button class="category-filter" data-category="학습">학습</button>
                <button class="category-filter" data-category="인프라">인프라</button>
                <button class="category-filter" data-category="성능">성능</button>
                <button class="category-filter" data-category="규제">규제</button>
                <button class="category-filter" data-category="비즈니스">비즈니스</button>
                <button class="category-filter" data-category="윤리">윤리</button>
                <button class="category-filter" data-category="운영">운영</button>
            </div>
        </div>

        <div class="stats" id="stats">검색 결과: 0개</div>

        <div class="content" id="content">
            <!-- 용어들이 여기 들어옵니다 -->
        </div>

        <div class="footer">
            <p>마지막 업데이트: 2026년 8월 14일 | AI 산업 필수 용어 400개+</p>
        </div>
    </div>

    <script>
        // 용어 데이터 (발음 추가)
        const terms = {
            '기초 AI/ML 용어': [
                { name: 'AI (Artificial Intelligence)', pron: '에이아이', def: '인공지능. 인간의 지능을 모방하는 컴퓨터 시스템', category: '기초' },
                { name: 'Algorithm', pron: '알고리듬', def: '알고리즘. 문제를 해결하기 위한 단계적 절차', category: '기초' },
                { name: 'Annotation', pron: '어노테이션', def: '데이터 라벨링. 학습 데이터에 정보(태그, 분류)를 추가하는 작업', category: '기초' },
                { name: 'Augmentation', pron: '어그멘테이션', def: '데이터 증강. 기존 데이터를 변형해 새로운 학습 데이터 생성', category: '기초' },
                { name: 'Backpropagation', pron: '백프로퍼게이션', def: '역전파. 신경망의 오류를 역방향으로 전파하며 가중치 업데이트', category: '기초' },
                { name: 'Batch', pron: '배치', def: '배치. 한 번에 처리하는 데이터의 묶음 (배치 크기)', category: '기초' },
                { name: 'Bias', pron: '바이어스', def: '편향. 모델이 특정 방향으로 치우친 경향 (수학적 편향과 윤리적 편향 구분)', category: '기초' },
                { name: 'BERT', pron: '버트', def: '양방향 인코더 표현 (Bidirectional Encoder Representations from Transformers)', category: '기초' },
                { name: 'Classification', pron: '클래시피케이션', def: '분류. 입력 데이터를 정해진 카테고리 중 하나로 구분하는 작업', category: '기초' },
                { name: 'Clustering', pron: '클러스터링', def: '군집화. 비슷한 특성의 데이터를 그룹으로 묶는 비지도 학습 방법', category: '기초' },
                { name: 'CNN', pron: '씨엔엔', def: 'Convolutional Neural Network. 합성곱 신경망. 이미지 처리에 최적화된 신경망 구조', category: '기초' },
                { name: 'Convergence', pron: '컨버전스', def: '수렴. 모델이 학습 과정에서 안정적인 상태에 도달하는 것', category: '기초' },
                { name: 'Dataset', pron: '데이터셋', def: '데이터셋. 학습 또는 평가에 사용되는 데이터 모음', category: '기초' },
                { name: 'Deep Learning', pron: '딥 러닝', def: '심층학습. 여러 층의 신경망을 이용한 머신러닝의 한 분야', category: '기초' },
                { name: 'Dropout', pron: '드롭아웃', def: '드롭아웃. 학습 중 신경망의 일부 뉴런을 무작위로 비활성화하는 정규화 기법', category: '기초' },
                { name: 'Embedding', pron: '엠베딩', def: '임베딩. 범주형 데이터를 벡터 공간의 연속 수치로 표현', category: '기초' },
                { name: 'Ensemble', pron: '앙상블', def: '앙상블. 여러 모델의 예측을 결합해 더 나은 성능을 얻는 기법', category: '기초' },
                { name: 'Epoch', pron: '에포크', def: '에포크. 전체 학습 데이터를 한 번 모두 학습하는 단위', category: '기초' },
                { name: 'Federated Learning', pron: '페더레이티드 러닝', def: '연합학습. 데이터를 중앙에 모으지 않고 분산된 기기에서 학습 (프라이버시 보호)', category: '기초' },
                { name: 'Feature', pron: '피쳐', def: '특성/특징. 입력 데이터의 개별 속성', category: '기초' },
            ],
            '생성형 AI & LLM': [
                { name: 'Alignment', pron: '얼라이먼트', def: '정렬. 모델의 출력이 인간의 가치와 의도와 일치하도록 만드는 과정', category: '생성형' },
                { name: 'Autoregressive Model', pron: '오토레그레시브 모델', def: '자회귀 모델. 이전 토큰을 기반으로 다음 토큰을 순차적으로 생성', category: '생성형' },
                { name: 'Chain of Thought (CoT)', pron: '체인 오브 쏫', def: '사고의 사슬. 모델이 단계적 추론 과정을 보여주는 프롬프트 기법', category: '생성형' },
                { name: 'Constitutional AI', pron: '컨스티튜셔널 에이아이', def: '헌법적 AI. 원칙 기반의 AI 정렬 방법론', category: '생성형' },
                { name: 'Context Window', pron: '컨텍스트 윈도우', def: '컨텍스트 윈도우. 모델이 한 번에 처리할 수 있는 최대 토큰 수', category: '생성형' },
                { name: 'Generative AI', pron: '제너레이티브 에이아이', def: '생성형 AI. 텍스트, 이미지, 음성 등 새로운 콘텐츠를 생성하는 AI', category: '생성형' },
                { name: 'GPT', pron: '지피티', def: 'Generative Pre-trained Transformer. 생성형 사전학습 트랜스포머', category: '생성형' },
                { name: 'Grounding', pron: '그라운딩', def: '그라운딩. 생성형 AI의 출력을 실제 지식과 연결해 환각 최소화', category: '생성형' },
                { name: 'Instruction Tuning', pron: '인스트럭션 튜닝', def: '명령어 튜닝. 모델이 사용자의 명령어를 더 잘 따르도록 미세조정', category: '생성형' },
                { name: 'Long Context', pron: '롱 컨텍스트', def: '롱 컨텍스트. 매우 긴 텍스트(수백만 토큰)를 한 번에 처리하는 기능', category: '생성형' },
                { name: 'Multimodal Model', pron: '멀티모달 모델', def: '멀티모달 모델. 텍스트, 이미지, 음성 등 여러 형태의 입력을 처리', category: '생성형' },
                { name: 'Mixture of Experts (MoE)', pron: '믹스처 오브 엑스퍼츠', def: '전문가 혼합. 여러 전문 신경망이 입력에 따라 선택적으로 작동', category: '생성형' },
                { name: 'Prompt', pron: '프롬프트', def: '프롬프트. 모델에 입력하는 명령어나 질문', category: '생성형' },
                { name: 'Prompt Engineering', pron: '프롬프트 엔지니어링', def: '프롬프트 엔지니어링. 모델로부터 원하는 출력을 얻기 위한 입력 설계', category: '생성형' },
                { name: 'RAG (Retrieval-Augmented Generation)', pron: '래그', def: '검색증강생성. 외부 지식베이스에서 정보를 검색해 생성 품질 향상 및 환각 최소화', category: '생성형' },
            ],
            '기술 아키텍처': [
                { name: 'Attention Mechanism', pron: '어텐션 메커니즘', def: '어텐션 메커니즘. 입력의 특정 부분에 집중하는 신경망 기법', category: '기술' },
                { name: 'AutoEncoder', pron: '오토인코더', def: '오토인코더. 입력을 압축하고 재구성하는 비지도 학습 모델', category: '기술' },
                { name: 'Chunking', pron: '청킹', def: '청킹. 긴 텍스트나 문서를 관리 가능한 크기의 작은 단위(청크)로 분할하는 기법. RAG 시스템에서 문서를 청크로 나눠 임베딩하고 검색하는 데 사용. 컨텍스트 윈도우 관리나 배치 처리에도 적용됨', category: '기술' },
                { name: 'Decoder', pron: '디코더', def: '디코더. 인코딩된 정보를 다시 원래 형태로 변환하는 신경망 부분', category: '기술' },
                { name: 'Diffusion Model', pron: '디퓨전 모델', def: '확산 모델. 노이즈에서 시작해 점진적으로 이미지를 생성하는 모델', category: '기술' },
                { name: 'Encoder', pron: '인코더', def: '인코더. 입력 데이터를 압축된 표현으로 변환하는 신경망 부분', category: '기술' },
                { name: 'Multi-Head Attention', pron: '멀티헤드 어텐션', def: '다중 헤드 어텐션. 여러 어텐션 메커니즘을 병렬로 작동', category: '기술' },
                { name: 'Self-Attention', pron: '셀프 어텐션', def: '자기주의. 입력의 각 위치가 다른 모든 위치와의 관계를 계산', category: '기술' },
                { name: 'Transformer', pron: '트랜스포머', def: '트랜스포머. 어텐션 메커니즘 기반의 신경망 아키텍처', category: '기술' },
                { name: 'Vision Transformer (ViT)', pron: '비전 트랜스포머', def: '시각 트랜스포머. 이미지를 패치로 나눠 처리하는 트랜스포머', category: '기술' },
                { name: 'DRA', pron: '디알에이', def: 'Dynamic Resource Allocation. 동적 자원 할당. 작업과 시스템 상태에 따라 실시간으로 리소스를 재할당하는 기법', category: '기술' },
                { name: 'Self-healing', pron: '셀프힐링', def: '자율 복구. 시스템이 장애를 자동으로 감지하고 복구하는 기능. AIOps에서 중요한 역할', category: '기술' },
                { name: 'Broker-less', pron: '브로커리스', def: '브로커리스. 메시지 전달 중개자 없이 노드 간에 직접 통신하는 방식. 병목 현상 감소와 저지연 달성', category: '기술' },
                { name: 'Event Backbone', pron: '이벤트 백본', def: '이벤트 백본. 시스템 내 모든 이벤트를 실시간으로 전파하는 기반 구조. 각 노드가 다른 노드의 상태를 밀리초 단위로 인지', category: '기술' },
                { name: 'Federation', pron: '페더레이션', def: '페더레이션. 여러 독립적인 Kubernetes 클러스터를 통합 제어하는 아키텍처. 멀티 클러스터 운영을 단일 제어 평면으로 관리', category: '기술' },
                { name: 'Heterogeneous', pron: '헤테로지니어스', def: '이기종. 서로 다른 종류의 하드웨어나 플랫폼을 통합하는 것. GPU, NPU, CPU 등 다양한 가속기를 하나의 시스템에서 관리', category: '기술' },

                { name: 'PinOps', pron: '핀옵스', def: 'Platform Infrastructure Operations. 개발팀이 셀프서비스로 인프라를 사용할 수 있도록 표준화된 플랫폼을 제공하고 운영하는 분야. DevOps의 진화형으로 개발자 경험(DX) 중심의 인프라 운영을 목표로 함', category: '운영' },
                { name: 'Model Drift', pron: '모델 드리프트', def: '모델 드리프트. 시간이 지나면서 모델의 성능이 저하되는 현상', category: '운영' },
                { name: 'Monitoring', pron: '모니터링', def: '모니터링. 배포된 모델의 성능과 건강 상태 지속적 점검', category: '운영' },
                { name: 'Shadow Deployment', pron: '섀도우 디플로이먼트', def: '섀도우 배포. 새 모델을 배포하되 실제 프로덕션에는 반영하지 않고 테스트', category: '운영' },
            ]
        };

        let filteredTerms = [];
        let currentCategory = 'all';

        // DOM 요소
        const searchInput = document.getElementById('searchInput');
        const contentDiv = document.getElementById('content');
        const statsDiv = document.getElementById('stats');
        const categoryFilters = document.querySelectorAll('.category-filter');

        // 초기 렌더링
        function render() {
            contentDiv.innerHTML = '';
            let totalResults = 0;

            for (const [sectionName, termList] of Object.entries(terms)) {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = 'section active';

                let sectionTitle = document.createElement('div');
                sectionTitle.className = 'section-title';
                sectionTitle.textContent = sectionName;
                sectionDiv.appendChild(sectionTitle);

                // 현재 카테고리의 용어만 필터링
                const filtered = termList.filter(term => {
                    if (currentCategory !== 'all' && term.category !== currentCategory) {
                        return false;
                    }
                    if (searchInput.value.trim() === '') {
                        return true;
                    }
                    const searchTerm = searchInput.value.toLowerCase();
                    const searchTermKo = searchInput.value; // 한글용 (소문자 변환 안 함)
                    return term.name.toLowerCase().includes(searchTerm) ||
                           term.def.toLowerCase().includes(searchTerm) ||
                           term.pron.includes(searchTermKo) ||
                           term.def.includes(searchTermKo);
                });

                filtered.forEach(term => {
                    const termDiv = document.createElement('div');
                    termDiv.className = 'term-item';
                    if (searchInput.value.trim() !== '' &&
                        (term.name.toLowerCase().includes(searchInput.value.toLowerCase()) ||
                         term.def.toLowerCase().includes(searchInput.value.toLowerCase()) ||
                         term.pron.includes(searchInput.value) ||
                         term.def.includes(searchInput.value))) {
                        termDiv.classList.add('highlight');
                    }

                    termDiv.innerHTML = `
                        <div class="term-header">
                            <div class="term-name">${term.name}</div>
                            <div class="term-pronunciation">${term.pron}</div>
                        </div>
                        <div class="term-definition">${term.def}</div>
                    `;
                    sectionDiv.appendChild(termDiv);
                    totalResults++;
                });

                if (filtered.length > 0) {
                    contentDiv.appendChild(sectionDiv);
                }
            }

            // 검색 결과 통계
            statsDiv.textContent = `검색 결과: ${totalResults}개`;

            // 결과가 없으면 메시지 표시
            if (totalResults === 0) {
                contentDiv.innerHTML = `<div class="no-results">
                    검색된 용어가 없습니다 🤔<br>
                    다른 검색어를 시도해보세요!
                </div>`;
            }
        }

        // 검색 이벤트
        searchInput.addEventListener('input', () => {
            render();
        });

        // 카테고리 필터 이벤트
        categoryFilters.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryFilters.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentCategory = btn.dataset.category;
                render();
            });
        });

        // 초기 렌더링
        render();
    </script>
</body>
</html>
